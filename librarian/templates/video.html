<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Interactive Video Handout</title>
    <style>
        :root {
            --color-bg-page: linear-gradient(135deg, #F0FDFA 0%, #F5F3FF 100%);
            --color-text-main: #1F2937;
            --color-text-dark: #111827;
            --color-text-muted: #6B7280;
            --color-text-body: #374151;
            --color-text-body-alt: #4B5563;
            --color-text-light: #94A3B8;
            --color-border: #E5E7EB;
            --color-primary: #8B5CF6;
            --color-primary-hover: #7C3AED;
            --color-primary-light: #F5F3FF;
            --color-primary-active: #ECE9FE;
            --color-primary-dark: #6D28D9;
            --color-accent-pink: #EC4899;
            --color-gradient-primary: linear-gradient(to right, #8B5CF6, #EC4899);
            --color-bg-gray: #F3F4F6;
            --color-bg-clue: #FCE7F3;
            --color-text-clue: #DB2777;
            --color-border-clue: #FBCFE8;
            --color-success-bg: #D1FAE5;
            --color-success-border: #10B981;
            --color-success-text: #065F46;
            --color-danger-bg: #FEE2E2;
            --color-danger-border: #EF4444;
            --color-danger-text: #991B1B;
            --color-disabled-bg: #E5E7EB;
            --color-disabled-text: #9CA3AF;
            --color-warning-bg: #FFFBEB;
            --color-warning-border: #FDE68A;
            --color-warning-text: #B45309;
            --color-warning-icon-bg: #F59E0B;
            --color-indigo-bg: #EEF2FF;
            --color-indigo-text: #4F46E5;
            --color-indigo-border: #C7D2FE;
            --color-bg-card: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: var(--color-bg-page);
            color: var(--color-text-main);
            padding: 24px;
        }
        .header {
            max-width: 1400px;
            margin: 0 auto 20px auto;
            text-align: left;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: var(--color-gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: var(--color-text-muted);
            font-size: 14px;
            margin-top: 5px;
        }
        .main-layout {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 24px;
            height: calc(100vh - 120px);
            min-height: 550px;
        }
        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
        .video-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: white;
            border: 1px solid var(--color-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .video-container iframe, .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .tab-panel {
            background: white;
            border: 1px solid var(--color-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }
        .tab-headers {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 10px;
            flex-shrink: 0;
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--color-text-muted);
            font-size: 16px;
            font-weight: 600;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            color: var(--color-text-dark);
            background: var(--color-bg-gray);
        }
        .tab-btn.active {
            color: white;
            background: var(--color-primary);
        }
        .tab-content {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        .tab-content::-webkit-scrollbar {
            width: 6px;
        }
        .tab-content::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 3px;
        }
        
        /* Interactive Transcript Styles */
        .transcript-line {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 5px;
        }
        .transcript-line:hover {
            background: var(--color-primary-light);
        }
        .transcript-line.active {
            background: var(--color-primary-active);
            border-left: 3px solid var(--color-primary);
        }
        .timestamp-badge {
            background: var(--color-primary-active);
            color: var(--color-primary-dark);
            font-size: 12px;
            font-weight: 700;
            font-family: monospace;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .line-text {
            font-size: 15px;
            line-height: 1.6;
            color: var(--color-text-body);
        }
        
        /* Quiz Styles */
        .quiz-intro {
            text-align: center;
            padding: 40px 20px;
        }
        .quiz-intro h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .quiz-intro p {
            color: var(--color-text-muted);
            margin-bottom: 25px;
        }
        .question-card {
            animation: fadeIn 0.4s ease;
        }
        .clue-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--color-bg-clue);
            color: var(--color-text-clue);
            border: 1px solid var(--color-border-clue);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 10px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.2s;
        }
        .clue-button:hover {
            background: var(--color-border-clue);
            transform: scale(1.03);
        }
        .option-btn {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 2px solid var(--color-border);
            background: white;
            color: var(--color-text-main);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--color-primary);
            background: var(--color-primary-light);
        }
        .option-btn.correct {
            background: var(--color-success-bg) !important;
            border-color: var(--color-success-border) !important;
            color: var(--color-success-text) !important;
        }
        .option-btn.incorrect {
            background: var(--color-danger-bg) !important;
            border-color: var(--color-danger-border) !important;
            color: var(--color-danger-text) !important;
        }
        .feedback-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: var(--color-bg-gray);
            border-left: 4px solid var(--color-primary);
            font-size: 14px;
            line-height: 1.5;
            color: var(--color-text-body-alt);
        }

        /* ===== Level 2 Quality Audit Badge & Psychometrics ===== */
        .l2-qa-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(16, 185, 129, 0.12);
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.3);
            margin-top: 8px;
            position: relative;
            cursor: help;
        }

        .l2-qa-tooltip {
            position: absolute;
            top: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(-4px);
            width: max-content;
            max-width: 320px;
            background: #1e293b;
            color: #f1f5f9;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.5;
            text-align: left;
            white-space: normal;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s;
            z-index: 60;
            pointer-events: none;
        }

        .l2-qa-tooltip::after {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-bottom-color: #1e293b;
        }

        .l2-qa-badge:hover .l2-qa-tooltip,
        .l2-qa-badge:focus-within .l2-qa-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .audit-point-subcard {
            background: rgba(248, 250, 252, 0.95);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-left: 3px solid rgba(124, 58, 237, 0.4);
            border-radius: 8px;
            padding: 9px 12px;
            margin-top: 8px;
            font-size: 12px;
            line-height: 1.5;
            color: var(--color-text-body-alt);
        }

        .audit-point-tag {
            font-size: 10.5px;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .audit-point-tag.rationale {
            background: rgba(16, 185, 129, 0.12);
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .audit-point-tag.trap {
            background: rgba(245, 158, 11, 0.12);
            color: #d97706;
            border: 1px solid rgba(245, 158, 11, 0.25);
        }
        .nav-btn {
            background: var(--color-primary);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 15px;
        }
        .nav-btn:hover {
            background: var(--color-primary-hover);
        }
        .nav-btn:disabled {
            background: var(--color-disabled-bg);
            color: var(--color-disabled-text);
            cursor: not-allowed;
        }
        .results-view {
            text-align: center;
            padding: 30px;
        }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: var(--color-primary);
            margin: 20px auto;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Vocabulary & Chunks Inline Highlight + Cards (No IPA, No CEFR) */
        mark.vocab-hl {
            background: rgba(79, 70, 229, 0.12);
            color: var(--color-primary);
            font-weight: 600;
            padding: 1px 5px;
            border-radius: 4px;
            border-bottom: 2px solid rgba(79, 70, 229, 0.45);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        mark.vocab-hl:hover {
            background: rgba(79, 70, 229, 0.22);
            border-bottom-color: var(--color-primary);
        }
        .vocab-popover {
            position: fixed;
            z-index: 9999;
            width: 340px;
            max-width: calc(100vw - 24px);
            background: #FFFFFF;
            border: 1px solid var(--color-indigo-border);
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 14px 32px -4px rgba(15, 23, 42, 0.16), 0 8px 14px -6px rgba(15, 23, 42, 0.1);
            display: none;
            animation: fadeIn 0.15s ease-out;
        }
        .vocab-popover-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }
        .vocab-popover-word {
            font-size: 16px;
            font-weight: 700;
            color: var(--color-primary);
        }
        .vocab-pos-badge {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--color-indigo-bg);
            color: var(--color-indigo-text);
            border: 1px solid var(--color-indigo-border);
            white-space: nowrap;
        }
        .vocab-card {
            background: var(--color-bg-gray);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .vocab-card:hover, .vocab-card.highlight-pulse {
            border-color: var(--color-indigo-border);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
        }
        .vocab-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .vocab-card-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .vocab-card-word {
            font-size: 17px;
            font-weight: 700;
            color: var(--color-text-main);
        }
        .vocab-ts-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            font-family: monospace;
            padding: 4px 10px;
            border-radius: 6px;
            background: var(--color-indigo-bg);
            color: var(--color-indigo-text);
            border: 1px solid var(--color-indigo-border);
            cursor: pointer;
            transition: all 0.15s;
        }
        .vocab-ts-btn:hover {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }
        .vocab-def {
            font-size: 14px;
            line-height: 1.55;
            color: var(--color-text-main);
            margin-bottom: 10px;
        }
        .vocab-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .vocab-meta-pill {
            font-size: 12px;
            padding: 3px 9px;
            border-radius: 6px;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            color: var(--color-text-body-alt);
        }
        .vocab-quote-box {
            font-size: 13px;
            line-height: 1.5;
            padding: 8px 12px;
            border-left: 3px solid var(--color-primary);
            background: var(--color-bg-card);
            border-radius: 0 6px 6px 0;
            color: var(--color-text-body-alt);
            margin-bottom: 6px;
        }
        .vocab-example-box {
            font-size: 13px;
            line-height: 1.5;
            padding: 6px 12px;
            color: var(--color-text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="vocab-popover" class="vocab-popover" onmouseenter="cancelHideVocabPopover()" onmouseleave="scheduleHideVocabPopover()" onclick="event.stopPropagation()"></div>

    <div class="header">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px;">
            <div>
                <h1 id="main-title">Interactive Video Handout</h1>
                <p id="main-meta">Language Learning Lab</p>
            </div>
            <div id="l2-qa-badge-container"></div>
        </div>
    </div>

    <div class="main-layout">
        <!-- Left Panel: Video Player -->
        <div class="video-panel">
            <div class="video-container" id="player-container">
                <!-- Injected automatically by JS depending on video type -->
            </div>
            <div style="font-size: 13px; color: var(--color-text-body-alt);">
                <strong>Tip:</strong> Click any transcript sentence or <code>▶ MM:SS</code> badge to play; click again to pause. Hover or click highlighted words for meanings.
            </div>
        </div>

        <!-- Right Panel: Tabs for Transcript, Vocabulary & Chunks, and Quiz -->
        <div class="tab-panel">
            <div class="tab-headers">
                <button class="tab-btn active" id="tab-transcript-btn" onclick="switchTab('transcript')">Transcript</button>
                <button class="tab-btn" id="tab-vocab-btn" onclick="switchTab('vocab')">Vocabulary & Chunks</button>
                <button class="tab-btn" id="tab-quiz-btn" onclick="switchTab('quiz')">Comprehension Quiz</button>
            </div>

            <!-- Scrollable Tab Contents -->
            <div class="tab-content" id="tab-transcript">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding: 10px 14px; margin-bottom: 12px; background: var(--color-bg-gray); border: 1px solid var(--color-border); border-radius: 10px;">
                    <span style="font-size: 12.5px; color: var(--color-text-body-alt);">Click any sentence below to play or pause from its timestamp.</span>
                    <label style="display: inline-flex; align-items: center; gap: 7px; background: var(--color-indigo-bg); color: var(--color-indigo-text); border: 1px solid var(--color-indigo-border); padding: 5px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; user-select: none;" title="When enabled, clicking a sentence in the transcript plays only that single sentence and automatically pauses at the end.">
                        <input type="checkbox" id="auto-pause-toggle" onchange="toggleSentenceAutoPause(this.checked)" style="accent-color: var(--color-primary); cursor: pointer;">
                        <span>Play Single Transcript Sentence (Auto-pause)</span>
                    </label>
                </div>
                <div id="transcript-lines-list"></div>
            </div>

            <div class="tab-content" id="tab-vocab" style="display: none;">
                <div id="vocab-cards-list"></div>
            </div>

            <div class="tab-content" id="tab-quiz" style="display: none;">
                <div id="quiz-flow-container"></div>
            </div>
        </div>
    </div>

    <script>
        // Injected data placeholder - do NOT replace with hardcoded data
        const quizData = { "title": "Sample", "video_url": "", "video_type": "youtube", "questions": [], "transcript": "" };

        let currentTab = 'transcript';
        let currentIdx = 0;
        let score = 0;
        let selectedOption = null;
        let isSubmitted = false;

        // Player seekers and handles
        let localPlayer = null;
        let ytPlayer = null;
        let parsedTranscriptSegments = [];
        let activeSeekKey = null;
        let activeSegmentIdx = -1;
        let activeSegmentStartSec = null;
        let activeSegmentEndSec = null;
        let lockedHighlightUntilMs = 0;
        let sentenceAutoPause = false;
        let rafMonitorId = null;
        let popoverHideTimer = null;

        function toggleSentenceAutoPause(checked) {
            sentenceAutoPause = Boolean(checked);
            if (sentenceAutoPause && isVideoPlaying()) {
                const cur = getCurrentVideoTime();
                const segIdx = findActiveSegmentIndex(cur);
                if (segIdx >= 0 && parsedTranscriptSegments[segIdx]) {
                    activeSegmentIdx = segIdx;
                    activeSegmentStartSec = parsedTranscriptSegments[segIdx].seconds;
                    activeSegmentEndSec = parsedTranscriptSegments[segIdx].endSeconds;
                    startPlaybackMonitor();
                }
            } else if (!sentenceAutoPause) {
                activeSegmentEndSec = null;
            }
        }

        function cancelHideVocabPopover() {
            if (popoverHideTimer) {
                clearTimeout(popoverHideTimer);
                popoverHideTimer = null;
            }
        }

        function scheduleHideVocabPopover() {
            cancelHideVocabPopover();
            popoverHideTimer = setTimeout(() => {
                const pop = document.getElementById('vocab-popover');
                if (pop) pop.style.display = 'none';
            }, 220);
        }

        function renderAuditBadge() {
            const container = document.getElementById('l2-qa-badge-container');
            if (!container || !quizData._expert_audit) return;
            const audit = quizData._expert_audit;
            const score = audit.overall_quality_score ?? 100;
            const accuracy = Math.round((audit.blind_solve_accuracy ?? 1.0) * 100);
            const passed = audit.pass_audit !== false;
            const isHighQuality = passed && accuracy >= 80;

            const cStats = audit.cure_stats || null;
            let text = `L2 Expert Audit: ${score}% (${accuracy}% Blind Accuracy)`;
            if (cStats && (cStats.repair > 0 || cStats.rewrite > 0)) {
                text = `L2 Expert Audit: ${score}% (Surgically Cured: +${cStats.repair + cStats.rewrite})`;
            }
            if (!isHighQuality) {
                text = `⚠️ L2 Review Needed: ${score}% (${accuracy}% Blind Accuracy)`;
            }
            const tooltip = audit.summary_verdict || '';

            const bg = isHighQuality ? 'rgba(16, 185, 129, 0.12)' : 'rgba(245, 158, 11, 0.12)';
            const color = isHighQuality ? '#059669' : '#d97706';
            const border = isHighQuality ? 'rgba(16, 185, 129, 0.3)' : 'rgba(245, 158, 11, 0.3)';

            const iconSvg = isHighQuality ? `
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <polyline points="9 12 11 14 15 10"></polyline>
                </svg>
            ` : `
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            `;

            container.innerHTML = `
                <div class="l2-qa-badge" style="background: ${bg}; color: ${color}; border-color: ${border};">
                    ${iconSvg}
                    <span>${text}</span>
                    <span class="l2-qa-tooltip">${tooltip.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>
                </div>
            `;
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeRegExp(str) {
            return String(str || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function initApp() {
            document.getElementById('main-title').innerText = quizData.title;
            const vocabCount = Array.isArray(quizData.vocabulary) ? quizData.vocabulary.length : 0;
            const meta = `Type: ${quizData.video_type.toUpperCase()} | ${vocabCount} Key Expressions & Words | ${quizData.questions.length} Quiz Questions`;
            document.getElementById('main-meta').innerText = meta;

            const vocabBtn = document.getElementById('tab-vocab-btn');
            if (vocabBtn && vocabCount > 0) {
                vocabBtn.innerText = `Vocabulary & Chunks (${vocabCount})`;
            }

            // Clean markdown formatting artifacts in questions
            if (Array.isArray(quizData.questions)) {
                quizData.questions.forEach(q => {
                    if (q.explanation) q.explanation = q.explanation.replace(/[*`]/g, '').replace(/\\"/g, '"').trim();
                    if (q.question) q.question = q.question.replace(/[*`]/g, '').replace(/\\"/g, '"').trim();
                });
            }

            document.addEventListener('click', () => {
                const pop = document.getElementById('vocab-popover');
                if (pop) pop.style.display = 'none';
            });

            renderAuditBadge();
            renderVideoPlayer();
            renderTranscript();
            renderVocabulary();
            renderQuiz();
        }

        function parseTimeToSeconds(timeStr) {
            timeStr = timeStr.replace(/[\[\]]/g, '').trim();
            const parts = timeStr.split(':');
            let secs = 0;
            if (parts.length === 3) {
                secs = parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseFloat(parts[2]);
            } else if (parts.length === 2) {
                secs = parseInt(parts[0]) * 60 + parseFloat(parts[1]);
            } else {
                secs = parseFloat(parts[0]);
            }
            return secs;
        }

        function renderVideoPlayer() {

                            <strong style="color: var(--color-text-body-alt); display: block; margin-bottom: 4px;">To attach a video to this quiz:</strong>

                                <li>Open the raw unit markdown file in <code>sources/</code>.</li>

                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                            </div>
                            <h3 style="font-size: 16px; font-weight: 700; margin: 0; color: var(--color-warning-text);">Local File Protocol Restriction</h3>

                            </a>

                }

                let embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?enablejsapi=1`;

                }
                container.innerHTML = `<iframe id="yt-player-iframe" src="${embedUrl}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                
                // Initialize Youtube IFrame API
                window.onYouTubeIframeAPIReady = function() {
                    ytPlayer = new YT.Player('yt-player-iframe');
                };
                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

            } else {
                // Local HTML5 Video Player
                const filename = url.substring(url.lastIndexOf('/') + 1);
                container.innerHTML = `
                    <video id="local-player" controls preload="metadata">
                        <source src="${url}" type="video/mp4">
                        <source src="../../raw/media/${filename}" type="video/mp4">
                        <source src="${filename}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                `;
                localPlayer = document.getElementById('local-player');
                if (localPlayer) {
                    localPlayer.addEventListener('play', () => {
                        updatePlayButtonsUI();
                        startPlaybackMonitor();
                    });
                    localPlayer.addEventListener('pause', () => {
                        updatePlayButtonsUI();
                        stopPlaybackMonitor();
                    });
                    localPlayer.addEventListener('ended', () => {
                        activeSegmentEndSec = null;
                        updatePlayButtonsUI();
                        stopPlaybackMonitor();
                    });
                    localPlayer.addEventListener('timeupdate', handleVideoTimeUpdate);
                }
            }
        }

        function getCurrentVideoTime() {
            if (localPlayer) {
                return Number(localPlayer.currentTime || 0);
            }
            if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
                return Number(ytPlayer.getCurrentTime() || 0);
            }
            return 0;
        }

        function isVideoPlaying() {
            if (localPlayer) {
                return !localPlayer.paused && !localPlayer.ended;
            }
            if (ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
                return ytPlayer.getPlayerState() === 1;
            }
            return false;
        }

        function pauseVideo() {
            if (localPlayer) {
                localPlayer.pause();
            } else if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
                ytPlayer.pauseVideo();
            }
            stopPlaybackMonitor();
            updatePlayButtonsUI();
        }

        function findBestSegmentForStart(startSec) {
            let bestSeg = null;
            let bestDiff = Infinity;
            for (let i = 0; i < parsedTranscriptSegments.length; i++) {
                const d = Math.abs(parsedTranscriptSegments[i].seconds - startSec);
                if (d < bestDiff) {
                    bestDiff = d;
                    bestSeg = parsedTranscriptSegments[i];
                }
            }
            return (bestSeg && bestDiff < 2.0) ? bestSeg : null;
        }

        function getEndSecForStart(startSec) {
            const seg = findBestSegmentForStart(startSec);
            return seg ? seg.endSeconds : (startSec + 6.0);
        }

        function findActiveSegmentIndex(cur) {
            if (!parsedTranscriptSegments.length) return -1;
            if (performance.now() < lockedHighlightUntilMs && activeSegmentIdx >= 0) {
                return activeSegmentIdx;
            }
            for (let i = parsedTranscriptSegments.length - 1; i >= 0; i--) {
                const seg = parsedTranscriptSegments[i];
                if (cur >= seg.seconds - 0.05) {
                    if (cur <= seg.nextStartSeconds + 0.1) {
                        return seg.idx;
                    }
                    break;
                }
            }
            return -1;
        }

        function updatePlayButtonsUI() {
            const playing = isVideoPlaying();
            document.querySelectorAll('.vocab-ts-btn[data-ts-key]').forEach(btn => {
                const key = btn.getAttribute('data-ts-key');
                const label = btn.getAttribute('data-ts-label') || '00:00';
                if (playing && activeSeekKey === key) {
                    btn.innerHTML = `⏸ ${escapeHtml(label)}`;
                    btn.style.background = 'var(--color-primary)';
                    btn.style.color = 'white';
                } else {
                    btn.innerHTML = `▶ ${escapeHtml(label)}`;
                    btn.style.background = '';
                    btn.style.color = '';
                }
            });
        }

        function stopPlaybackMonitor() {
            if (rafMonitorId !== null) {
                cancelAnimationFrame(rafMonitorId);
                rafMonitorId = null;
            }
        }

        function startPlaybackMonitor() {
            stopPlaybackMonitor();
            function tick() {
                if (!isVideoPlaying()) {
                    rafMonitorId = null;
                    return;
                }
                const cur = getCurrentVideoTime();
                if (sentenceAutoPause && activeSegmentEndSec !== null) {
                    // If user scrubbed manually far outside the active sentence, disarm previous boundary
                    if (activeSegmentStartSec !== null && (cur < activeSegmentStartSec - 0.6 || cur > activeSegmentEndSec + 1.2)) {
                        activeSegmentEndSec = null;
                    } else if (cur >= activeSegmentEndSec) {
                        activeSegmentEndSec = null;
                        pauseVideo();
                        return;
                    }
                }
                rafMonitorId = requestAnimationFrame(tick);
            }
            rafMonitorId = requestAnimationFrame(tick);
        }

        function handleVideoTimeUpdate() {
            if (!localPlayer) return;
            const cur = localPlayer.currentTime;
            if (sentenceAutoPause && activeSegmentEndSec !== null && cur >= activeSegmentEndSec) {
                activeSegmentEndSec = null;
                pauseVideo();
                return;
            }
            // Auto-highlight corresponding transcript line while playing
            if (!localPlayer.paused && parsedTranscriptSegments.length > 0) {
                const activeIdx = findActiveSegmentIndex(cur);
                if (activeIdx >= 0) {
                    document.querySelectorAll('.transcript-line').forEach(el => el.classList.remove('active'));
                    const currentLine = document.getElementById(`line-${activeIdx}`);
                    if (currentLine) currentLine.classList.add('active');
                }
            }
        }

        function seekVideo(seconds, seekKey = null, endSeconds = null, segmentIdx = -1) {
            const matchedSeg = (segmentIdx >= 0 && parsedTranscriptSegments[segmentIdx])
                ? parsedTranscriptSegments[segmentIdx]
                : findBestSegmentForStart(seconds);
            const targetStart = matchedSeg ? matchedSeg.seconds : Number(seconds);
            const resolvedEnd = endSeconds !== null
                ? endSeconds
                : (matchedSeg ? matchedSeg.endSeconds : (targetStart + 6.0));
            const targetKey = seekKey || `sec-${targetStart.toFixed(2)}`;

            // If user clicks the exact same line or button while video is playing, toggle pause!
            if (activeSeekKey === targetKey && isVideoPlaying()) {
                pauseVideo();
                return;
            }

            // If user clicks the same line/button while paused inside the middle of that sentence, resume!
            if (activeSeekKey === targetKey && localPlayer && localPlayer.paused) {
                const cur = localPlayer.currentTime;
                if (cur > targetStart + 0.25 && cur < resolvedEnd - 0.35) {
                    activeSegmentStartSec = targetStart;
                    activeSegmentEndSec = sentenceAutoPause ? resolvedEnd : null;
                    localPlayer.play().catch(() => {});
                    startPlaybackMonitor();
                    updatePlayButtonsUI();
                    return;
                }
            }

            activeSeekKey = targetKey;
            activeSegmentIdx = matchedSeg ? matchedSeg.idx : segmentIdx;
            activeSegmentStartSec = targetStart;
            activeSegmentEndSec = sentenceAutoPause ? resolvedEnd : null;
            lockedHighlightUntilMs = performance.now() + 380;

            if (activeSegmentIdx >= 0) {
                highlightLine(activeSegmentIdx);
            }

            if (localPlayer) {
                localPlayer.currentTime = targetStart;
                localPlayer.play().catch(() => {});
                startPlaybackMonitor();
            } else if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
                ytPlayer.seekTo(targetStart, true);
                ytPlayer.playVideo();
                startPlaybackMonitor();
            } else {
                console.log(`Seeking to ${targetStart}s.`);
            }
            updatePlayButtonsUI();
        }

        function highlightVocabInLine(lineText) {
            let safeHtml = escapeHtml(lineText);
            const vocabList = Array.isArray(quizData.vocabulary) ? quizData.vocabulary : [];
            if (!vocabList.length) return safeHtml;

            const normLine = lineText.replace(/\s+/g, ' ').trim().toLowerCase();
            // Gather items whose quoted_sentence matches this transcript sentence (or whose surface_match appears in it)
            const candidates = [];
            vocabList.forEach((v, vIdx) => {
                const surf = String(v.surface_match || v.word || '').replace(/\[[^\]]+\]/g, '').trim();
                if (!surf) return;
                const normQuote = String(v.quoted_sentence || '').replace(/\s+/g, ' ').trim().toLowerCase();
                if (normQuote && (normLine.includes(normQuote) || normQuote.includes(normLine))) {
                    candidates.push({ vIdx, surf });
                }
            });
            // Sort longer phrases first so multi-word chunks wrap before single words
            candidates.sort((a, b) => b.surf.length - a.surf.length);

            candidates.forEach(({ vIdx, surf }) => {
                const escapedSurf = escapeHtml(surf);
                const pattern = new RegExp(`(^|[^A-Za-z0-9_>])(${escapeRegExp(escapedSurf)})(?=$|[^A-Za-z0-9_<])`, 'i');
                safeHtml = safeHtml.replace(pattern, (m, prefix, matchedWord) => {
                    return `${prefix}<mark class="vocab-hl" data-vocab-idx="${vIdx}" onmouseenter="showVocabPopover(event, ${vIdx})" onmouseleave="scheduleHideVocabPopover()" onclick="event.stopPropagation(); showVocabPopover(event, ${vIdx})">${matchedWord}</mark>`;
                });
            });
            return safeHtml;
        }

        function showVocabPopover(event, vIdx) {
            cancelHideVocabPopover();
            const vocabList = Array.isArray(quizData.vocabulary) ? quizData.vocabulary : [];
            const v = vocabList[vIdx];
            const pop = document.getElementById('vocab-popover');
            if (!v || !pop) return;

            const secVal = Number(v.seconds || 0);
            const tsKey = `vocab-${vIdx}`;
            const tsLabel = v.timestamp || '00:00';
            const isPlayingThis = isVideoPlaying() && activeSeekKey === tsKey;

            const patternHtml = v.pattern
                ? `<div style="font-size: 12px; color: var(--color-text-body-alt); background: var(--color-bg-gray); padding: 5px 9px; border-radius: 6px; margin-bottom: 10px; border: 1px solid var(--color-border);"><strong>Pattern:</strong> <code>${escapeHtml(v.pattern)}</code></div>`
                : '';

            pop.innerHTML = `
                <div class="vocab-popover-header">
                    <span class="vocab-popover-word">${escapeHtml(v.word)}</span>
                    <span class="vocab-pos-badge">${escapeHtml(v.part_of_speech)}</span>
                </div>
                <div style="font-size: 13.5px; line-height: 1.55; color: var(--color-text-main); margin-bottom: 10px;">
                    ${escapeHtml(v.definition)}
                </div>
                ${patternHtml}
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--color-border);">
                    <button class="vocab-ts-btn" data-ts-key="${tsKey}" data-ts-label="${escapeHtml(tsLabel)}" onclick="seekVideo(${secVal}, '${tsKey}')">
                        ${isPlayingThis ? '⏸' : '▶'} ${escapeHtml(tsLabel)}
                    </button>
                    <button class="vocab-ts-btn" style="font-family: inherit;" onclick="jumpToVocabCard(${vIdx})">
                        Full Card →
                    </button>
                </div>
            `;

            pop.style.display = 'block';
            const rect = event.currentTarget.getBoundingClientRect();
            const popWidth = 340;
            let left = rect.left;
            if (left + popWidth > window.innerWidth - 16) {
                left = Math.max(12, window.innerWidth - popWidth - 16);
            }
            let top = rect.bottom + 8;
            if (top + 200 > window.innerHeight - 16) {
                top = Math.max(12, rect.top - 190);
            }
            pop.style.left = `${left}px`;
            pop.style.top = `${top}px`;
        }

        function jumpToVocabCard(vIdx) {
            const pop = document.getElementById('vocab-popover');
            if (pop) pop.style.display = 'none';
            switchTab('vocab');
            const card = document.getElementById(`vocab-card-${vIdx}`);
            if (card) {
                document.querySelectorAll('.vocab-card').forEach(el => el.classList.remove('highlight-pulse'));
                card.classList.add('highlight-pulse');
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function renderVocabulary() {
            const container = document.getElementById('vocab-cards-list');
            if (!container) return;
            const vocabList = Array.isArray(quizData.vocabulary) ? quizData.vocabulary : [];
            if (!vocabList.length) {
                container.innerHTML = `
                    <div class="quiz-intro">
                        <h2>No Vocabulary Extracted</h2>
                        <p>Re-compile this video handout to extract contextual vocabulary and expressions.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = vocabList.map((v, i) => {
                const pills = [];
                if (v.pattern) {
                    pills.push(`<span class="vocab-meta-pill"><strong>Pattern:</strong> <code>${escapeHtml(v.pattern)}</code></span>`);
                }
                if (Array.isArray(v.collocations) && v.collocations.length > 0) {
                    pills.push(`<span class="vocab-meta-pill"><strong>Collocations:</strong> ${escapeHtml(v.collocations.join(' · '))}</span>`);
                }
                const metaRow = pills.length ? `<div class="vocab-meta-row">${pills.join('')}</div>` : '';

                // Bold the matched surface span inside the video quote
                let quoteHtml = escapeHtml(v.quoted_sentence || '');
                const surf = String(v.surface_match || '').trim();
                if (surf) {
                    const qPat = new RegExp(`(${escapeRegExp(escapeHtml(surf))})`, 'i');
                    quoteHtml = quoteHtml.replace(qPat, '<strong style="color: var(--color-primary);">$1</strong>');
                }

                const exampleHtml = v.example_usage
                    ? `<div class="vocab-example-box">📖 Dictionary example: "${escapeHtml(v.example_usage)}"</div>`
                    : '';

                const tsKey = `vocab-${i}`;
                const tsLabel = v.timestamp || '00:00';
                return `
                    <div class="vocab-card" id="vocab-card-${i}">
                        <div class="vocab-card-header">
                            <div class="vocab-card-title-group">
                                <span class="vocab-card-word">${escapeHtml(v.word)}</span>
                                <span class="vocab-pos-badge">${escapeHtml(v.part_of_speech)}</span>
                            </div>
                            <button class="vocab-ts-btn" data-ts-key="${tsKey}" data-ts-label="${escapeHtml(tsLabel)}" onclick="seekVideo(${Number(v.seconds || 0)}, '${tsKey}')" title="Click to play sentence; click again to pause">
                                ▶ ${escapeHtml(tsLabel)}
                            </button>
                        </div>
                        <div class="vocab-def">${escapeHtml(v.definition)}</div>
                        ${metaRow}
                        <div class="vocab-quote-box">🎬 ${quoteHtml}</div>
                        ${exampleHtml}
                    </div>
                `;
            }).join('');
        }

        function renderTranscript() {
            const container = document.getElementById('transcript-lines-list');
            const rawText = quizData.transcript || "";
            
            // Extract individual dialogue lines: e.g. [00:15.20] Hello World
            const lineRegex = /(\[[0-9:.]+\])\s*(.+)/g;
            let match;
            const rawSegments = [];
            let idx = 0;

            while ((match = lineRegex.exec(rawText)) !== null) {
                const timestamp = match[1];
                const text = match[2];
                const seconds = parseTimeToSeconds(timestamp);
                const formattedTs = timestamp.replace(/[\[\]]/g, '').replace(/\.\d+$/, '');
                rawSegments.push({ idx, timestamp, formattedTs, text, seconds });
                idx++;
            }

            parsedTranscriptSegments = rawSegments.map((seg, i) => {
                const nextStart = i + 1 < rawSegments.length ? rawSegments[i + 1].seconds : seg.seconds + 8.0;
                const wordCount = Math.max(1, seg.text.trim().split(/\s+/).length);
                const maxSpeechSpan = Math.max(3.5, wordCount * 0.52 + 1.8);
                const rawSpan = Math.max(0.8, nextStart - seg.seconds);
                const effectiveEnd = rawSpan > maxSpeechSpan
                    ? seg.seconds + Math.max(2.8, wordCount * 0.45 + 1.1)
                    : Math.max(seg.seconds + 0.6, nextStart - 0.06);
                return {
                    ...seg,
                    nextStartSeconds: nextStart,
                    endSeconds: effectiveEnd
                };
            });

            let linesHtml = parsedTranscriptSegments.map(seg => {
                const highlightedText = highlightVocabInLine(seg.text);
                const lineKey = `line-${seg.idx}`;
                return `
                    <div class="transcript-line" id="line-${seg.idx}" onclick="seekVideo(${seg.seconds}, '${lineKey}', ${seg.endSeconds}, ${seg.idx})">
                        <span class="timestamp-badge">${seg.formattedTs}</span>
                        <div class="line-text">${highlightedText}</div>
                    </div>
                `;
            }).join('');

            if (!linesHtml) {
                // Fallback for simple line-by-line paragraph parsing
                const simpleLines = rawText.split('\n').filter(l => l.trim().length > 0);
                linesHtml = simpleLines.map((line, i) => `
                    <div class="transcript-line" id="line-${i}">
                        <div class="line-text">${highlightVocabInLine(line)}</div>
                    </div>
                `).join('');
            }

            container.innerHTML = linesHtml;
        }

        function highlightLine(idx) {
            document.querySelectorAll('.transcript-line').forEach(el => el.classList.remove('active'));
            const currentLine = document.getElementById(`line-${idx}`);
            if (currentLine) {
                currentLine.classList.add('active');
                currentLine.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-flow-container');
            if (quizData.questions.length === 0) {
                container.innerHTML = `
                    <div class="quiz-intro">
                        <h2>No Questions Available</h2>
                        <p>This video transcript does not contain any compiled quiz questions.</p>
                    </div>
                `;
                return;
            }

            if (currentIdx >= quizData.questions.length) {
                renderResults();
                return;
            }

            const q = quizData.questions[currentIdx];
            const progressPct = ((currentIdx + 1) / quizData.questions.length) * 100;
            const targetSecs = parseTimeToSeconds(q.timestamp);

            container.innerHTML = `
                <div class="question-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <span style="font-size: 13px; color: var(--color-text-light);">Question ${currentIdx + 1} of ${quizData.questions.length}</span>
                        <span style="font-size: 13px; color: var(--color-indigo-text); font-weight: 600;">Score: ${score}/${currentIdx}</span>
                    </div>
                    
                    <button class="clue-button" onclick="seekVideo(${targetSecs})">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Listen to Clue at ${q.timestamp}
                    </button>
 
                    <h2 style="font-size: 18px; line-height: 1.5; margin-bottom: 20px;">${q.question}</h2>

                    <div class="options-list">
                        ${q.options.map((opt, i) => `
                            <button class="option-btn" id="option-${i}" onclick="selectOption(${i})" ${isSubmitted ? 'disabled' : ''}>
                                ${opt}
                            </button>
                        `).join('')}
                    </div>

                    ${isSubmitted ? `
                        <div class="feedback-box">
                            <strong>Explanation:</strong> ${q.explanation}
                            ${(() => {
                                const audit = quizData._expert_audit;
                                if (!audit || !Array.isArray(audit.questions) || !audit.questions[currentIdx]) return '';
                                const itemAudit = audit.questions[currentIdx];
                                if (!Array.isArray(itemAudit.distractors) || itemAudit.distractors.length === 0) return '';
                                
                                let dHtml = '<div style="margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(0,0,0,0.1);">';
                                dHtml += '<div style="font-weight: 700; font-size: 12px; color: var(--color-primary); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px;">Expert Distractor Analysis & Traps:</div>';
                                
                                itemAudit.distractors.forEach(d => {
                                    if (!d) return;
                                    const letter = d.option_letter || '?';
                                    const isTarget = (letter.charCodeAt(0) - 65 === q.correct_answer_index);
                                    const tagClass = isTarget ? 'audit-point-tag rationale' : 'audit-point-tag trap';
                                    let trapLabel = d.trap_type || (isTarget ? 'Correct Answer' : 'Plausible Distractor');
                                    if (!isTarget && trapLabel.toLowerCase().includes('correct')) trapLabel = 'Plausible Distractor';
                                    const plausibility = d.plausibility_rating ? ` · Plausibility: ${d.plausibility_rating}` : '';
                                    
                                    dHtml += `
                                        <div class="audit-point-subcard">
                                            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
                                                <strong style="color: var(--color-primary);">Option [${letter}]:</strong>
                                                <span class="${tagClass}">${trapLabel}${plausibility}</span>
                                            </div>
                                            ${d.elimination_rationale ? `<div style="font-size: 12px; color: var(--color-text-body-alt);">${d.elimination_rationale}</div>` : ''}
                                        </div>
                                    `;
                                });
                                dHtml += '</div>';
                                return dHtml;
                            })()}
                        </div>
                    ` : ''}

                    <button class="nav-btn" id="submit-next-btn" onclick="handleNavigation()" ${selectedOption === null ? 'disabled' : ''}>
                        ${isSubmitted ? (currentIdx === quizData.questions.length - 1 ? 'Finish' : 'Next Question') : 'Submit Answer'}
                    </button>
                </div>
            `;

            // If already submitted, restore button styles
            if (isSubmitted) {
                revealAnswers();
            }
        }

        function selectOption(idx) {
            if (isSubmitted) return;
            selectedOption = idx;
            document.querySelectorAll('.option-btn').forEach(btn => btn.style.borderColor = 'rgba(255,255,255,0.1)');
            document.getElementById(`option-${idx}`).style.borderColor = 'var(--color-indigo-border)';
            document.getElementById('submit-next-btn').disabled = false;
        }

        function handleNavigation() {
            const q = quizData.questions[currentIdx];
            if (!isSubmitted) {
                isSubmitted = true;
                if (selectedOption === q.correct_answer_index) {
                    score++;
                }
                renderQuiz();
            } else {
                currentIdx++;
                selectedOption = null;
                isSubmitted = false;
                renderQuiz();
            }
        }

        function revealAnswers() {
            const q = quizData.questions[currentIdx];
            q.options.forEach((_, i) => {
                const btn = document.getElementById(`option-${i}`);
                if (i === q.correct_answer_index) {
                    btn.classList.add('correct');
                } else if (i === selectedOption) {
                    btn.classList.add('incorrect');
                }
            });
        }

        function renderResults() {
            const container = document.getElementById('quiz-flow-container');
            const pct = Math.round((score / quizData.questions.length) * 100);

            let auditHtml = '';
            if (quizData._expert_audit) {
                const audit = quizData._expert_audit;
                const aScore = audit.overall_quality_score ?? 100;
                const acc = Math.round((audit.blind_solve_accuracy ?? 1.0) * 100);
                auditHtml = `
                    <div style="margin-bottom: 20px;">
                        <span class="l2-qa-badge" style="background: rgba(16, 185, 129, 0.12); color: #059669; border-color: rgba(16, 185, 129, 0.3);">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                <polyline points="9 12 11 14 15 10"></polyline>
                            </svg>
                            <span>L2 Expert Audited: ${aScore}% (${acc}% Blind Accuracy)</span>
                        </span>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="results-view animate">
                    <h2>Quiz Completed!</h2>
                    ${auditHtml}
                    <div class="score-circle">${score}/${quizData.questions.length}</div>
                    <p style="color: var(--color-text-light); margin-bottom: 20px;">You scored <strong>${pct}%</strong> on this video quiz.</p>
                    <button class="nav-btn" onclick="restartQuiz()">Restart Quiz</button>
                </div>
            `;
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            selectedOption = null;
            isSubmitted = false;
            renderQuiz();
        }

        function switchTab(tab) {
            currentTab = tab;
            const pop = document.getElementById('vocab-popover');
            if (pop) pop.style.display = 'none';
            document.getElementById('tab-transcript-btn').classList.toggle('active', tab === 'transcript');
            const vocabBtn = document.getElementById('tab-vocab-btn');
            if (vocabBtn) vocabBtn.classList.toggle('active', tab === 'vocab');
            document.getElementById('tab-quiz-btn').classList.toggle('active', tab === 'quiz');
            document.getElementById('tab-transcript').style.display = tab === 'transcript' ? 'block' : 'none';
            const vocabTab = document.getElementById('tab-vocab');
            if (vocabTab) vocabTab.style.display = tab === 'vocab' ? 'block' : 'none';
            document.getElementById('tab-quiz').style.display = tab === 'quiz' ? 'block' : 'none';
        }

        // Initialize application when DOM loads
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
