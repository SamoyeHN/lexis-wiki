[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexis"
version = "3.0.0"
description = "A neuro-symbolic linguistic platform and interactive assessment generator for ESL teaching knowledge wikis."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Gemini CLI Agent" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "youtube-transcript-api",
    "yt-dlp",
    "spacy>=3.8.0",
    "wn>=1.1.0",
    "cefrpy>=1.0.0",
]

[project.optional-dependencies]
video = [
    "faster-whisper",
    "pyinstaller",
]
test = [
    "pytest",
]

[project.scripts]
lexis = "librarian.cli:main"

[tool.setuptools.packages.find]
include = ["librarian*"]

[tool.setuptools.package-data]
librarian = ["prompts/*.md", "templates/*.html", "static/css/*.css", "static/js/*.js"]
