name: Lexis Wiki CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Fast Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest anyio
          pip install -e .
          python -m spacy download en_core_web_sm
          python -m wn download "oewn:2025+" || true

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Fast Unit Tests (Zero-Heavy-Corpus Core Suite)
        run: |
          pytest \
            tests/test_dashboard_api.py \
            tests/test_exporter.py \
            tests/test_cli.py \
            tests/test_template_assets.py \
            tests/test_audit_batch.py \
            tests/test_evaluator.py \
            tests/test_glossary_ledger.py \
            -v
